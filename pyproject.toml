[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cardcoach"
version = "0.1.0"
description = "Audit credit-card rewards and fees from statement rows, and ship the same workflow as chat skills."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["credit-card", "rewards", "statement", "agent-skills"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.scripts]
cardcoach = "cardcoach.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
